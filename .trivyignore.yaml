# Risk acceptance for known vulnerabilities that cannot be fixed yet.
# Use: trivy image --ignorefile .trivyignore.yaml <image>
#
# pillow (dashboard image only): every finding below is fixed in pillow 13.0.0,
# but streamlit 1.58.0 (the version Streamlit Community Cloud runs) requires
# pillow<13. pillow 12.3.0 is the newest allowed version and is already pinned.
# All of these are triggered by decoding a crafted image. NorthStar never decodes
# user-supplied images: no file_uploader, camera_input, Image.open or st.image
# anywhere in src/northstar or src/rag_assistant; pillow only touches images
# shipped inside the image. The API image does not contain pillow at all.
# Review: when upgrading Streamlit, or by the expiry date, whichever comes first.
# Accepted 2026-10-22 by George Smith.
vulnerabilities:
  - id: CVE-2026-112390
    purls:
      - pkg:pypi/pillow@12.3.0
    expired_at: 2027-01-31
    statement: Fixed only in pillow 13; blocked by streamlit 1.58 (pillow<13). Not reachable - the app never decodes user-supplied images.
