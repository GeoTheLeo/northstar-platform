[tool.mypy]
python_version = "3.11"

strict = true

warn_return_any = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_unreachable = true

show_error_codes = true
pretty = true

exclude = [
    "^\\.venv/",
    "^venv/",
]

[[tool.mypy.overrides]]
module = [
    "sklearn.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
    "joblib",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
    "plotly",
    "plotly.*",
]
ignore_missing_imports = true